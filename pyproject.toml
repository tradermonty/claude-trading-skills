[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# This is a scripts-only project, not a Python package
packages = []

[project]
name = "claude-trading-skills"
version = "0.1.0"
description = "Claude Skills for equity investors and traders"
requires-python = ">=3.11.5,<3.14"
dependencies = [
    "jsonschema>=4.25.1",
    "packaging>=24.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "scipy>=1.13.1",
    "yfinance>=0.2.0",
]

[project.optional-dependencies]
market-calendar = [
    "pandas-market-calendars==5.2.2",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff==0.17.4",
    "detect-secrets>=1.5.0",
    "codespell>=2.3.0",
    "pre-commit>=3.0.0",
    "pip-audit==2.10.1",
    "bandit[toml]>=1.9.0",
]
ci = [
    "beautifulsoup4",
    "lxml",
    "pyarrow==26.0.1",
    "statsmodels>=0.14,<0.15",
    "pandas-market-calendars==5.2.2",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"
# Standalone packaged skills retain Python 3.9 source compatibility even though
# the repository's shared locked development environment starts at Python 3.11.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C901"]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "E402",  # module-level import not at top (sys.path manipulation in conftest)
]

# Fixed ceiling for existing production complexity; lower as debt is removed.
[tool.ruff.lint.mccabe]
max-complexity = 128

[tool.ruff.lint.per-file-ignores]
"**/conftest.py" = ["E402"]
"**/test_*.py" = ["E402"]
# Preserve runtime-evaluable annotations for the standalone Python 3.9 calendar.
"**/_market_calendar.py" = ["UP007", "UP045"]
"scripts/market_calendar/market_calendar.py" = ["UP007", "UP045"]

[tool.pytest.ini_options]
pythonpath = ["."]
# importlib mode resolves conftest/module name collisions across skills
# (each skill has its own scorer.py, calculators/, helpers.py).
# With importlib, a single `pytest` invocation discovers all tests safely.
# scripts/run_all_tests.sh is kept for backward compatibility.
addopts = "--import-mode=importlib -p scripts.pytest_firstparty_warnings"
# Keep aligned with scripts.ci_test_matrix.discover (guarded by root pytest tests).
testpaths = [
    "scripts/tests",
    "skills/backtest-expert/scripts/tests",
    "skills/breadth-chart-analyst/scripts/tests",
