- id: backtest-expert
  profile: executable_workflow_trading
  overrides:
    unit_tests:
      value: passed
      rationale: "Single executable script evaluate_backtest.py: required_keys.issubset on the produced evaluate() result and write_outputs read-back of the JSON/MD report (output-schema conformance); fail-closed CLI test exits 1, writes no report, on invalid input, plus evidence gates blocking Deploy on too-good results; happy/boundary fixtures (win_rate 0/100, expectancy threshold, profit-factor boundaries)."
      evidence:
      - command: python3 scripts/ci_test_matrix.py install backtest-expert && python3 scripts/ci_test_matrix.py run backtest-expert
      - tests: skills/backtest-expert/scripts/tests/test_evaluate_backtest.py
      - provenance: skills/<id>/scripts/tests (skill-local) validate this skill's own output schema and fail-closed behavior; repo-level tests are NOT cited as schema evidence
