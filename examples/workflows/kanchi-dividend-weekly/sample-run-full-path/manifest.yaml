execution_evidence_limitations:
- The live kanchi_candidates producer (build_entry_signals.py) requires FMP data and
  is not executed; step 3 recomputes the native verdict tier from fixture evidence.
- stock_memo is generated by the offline build_sop_plan.py planning CLI, not the hand-written
  stock-note-template one-pager.
- Screener steps 1-2 are human-approved candidate-list fixtures; no FINVIZ or FMP
  screener is called.
- Step 4 calls the native tax-planning CLI on fictional holdings; account-location
  advice remains advisory.
- Step 5 calls the native dividend review-queue CLI on fictional holdings; a WARN/REVIEW
  never triggers an automatic sell.
- Step 6 calls the native trader-memory-core ingest and link_report APIs on disposable
  temporary state; every thesis stays IDEA and no order is placed or authorized.
