schema_version: 1
workflow_id: multi-asset-opportunity-daily
fixed_timestamp: "2026-06-29T12:00:00+00:00"

inputs:
  macro_regime_fixture: replay-inputs/macro-regime.json
  hot_themes_fixture: replay-inputs/hot-themes.json
  catalyst_news_fixture: replay-inputs/catalyst-news.json
  hypothesis_fixture: replay-inputs/hypothesis-cards.json
  sizing_parameters: replay-inputs/sizing-parameters.json
  journal_decision: replay-inputs/journal-decision.json

steps:
  - step: 1
    executor: multi_asset_macro_regime
    executor_mode: manual_contract
    gate_policy: continue
    output_files:
      macro_regime_brief:
        canonical: 01_macro_regime_brief.json

  - step: 2
    executor: multi_asset_hot_themes
    executor_mode: manual_contract
    gate_policy: continue
    output_files:
      hot_themes:
        canonical: 02_hot_themes.json

  - step: 3
    executor: multi_asset_catalyst_news
    executor_mode: manual_contract
    gate_policy: continue
    output_files:
      catalyst_news_brief:
        canonical: 03_catalyst_news_brief.json

  - step: 4
    executor: multi_asset_hypothesis
    executor_mode: manual_contract
    gate_policy: record_only
    output_files:
      hypothesis_cards:
        canonical: 04_hypothesis_cards.json

  - step: 5
    executor: multi_asset_size
    executor_mode: native_cli
    gate_policy: continue
    output_files:
      sized_hypotheses:
        canonical: 05_sized_hypotheses.json

  - step: 6
    executor: multi_asset_journal
    executor_mode: manual_contract
    gate_policy: record_only
    output_files:
      opportunity_journal_entries:
        canonical: 06_opportunity_journal_entries.json

variants:
  required-only:
    enabled_steps:
      - 1
      - 2
      - 4
      - 5
      - 6
    golden_dir: replay-run
  full-path:
    enabled_steps:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
    golden_dir: replay-run-full-path
