  news: replay-inputs/news.json
  price: replay-inputs/price.json
  decision: replay-inputs/decision.json
steps:
- step: 1
  executor: shapiro_manual
  executor_mode: manual_contract
  gate_policy: continue
  output_files:
    cot_crowding_report:
      canonical: 01_cot_crowding_report.json
- step: 2
  executor: shapiro_manual
  executor_mode: manual_contract
  gate_policy: continue
  output_files:
    news_failure_verdict:
      canonical: 02_news_failure_verdict.json
- step: 3
  executor: shapiro_manual
  executor_mode: manual_contract
  gate_policy: continue
  output_files:
    price_action_confirmation_report:
      canonical: 03_price_action_confirmation_report.json
- step: 4
  executor: shapiro_gate
  executor_mode: native_cli
  gate_policy: continue
  output_files:
    contrarian_setup_gate_report:
      canonical: 04_contrarian_setup_gate_report.json
- step: 5
  executor: shapiro_size
  executor_mode: native_cli
  gate_policy: continue
