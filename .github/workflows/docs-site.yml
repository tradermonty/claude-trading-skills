name: Docs site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and validate docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"

      - name: Sync locked checker dependencies
        run: uv sync --locked --no-install-project

      - name: Verify committed Bundler lockfile
        run: test -f docs/Gemfile.lock

      - name: Set up locked GitHub Pages toolchain
        uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: "3.3.9"
          bundler-cache: true
          working-directory: docs

      - name: Validate source permalinks and language peers
        run: uv run --locked --no-sync python scripts/check_docs_site.py source

      - name: Validate external-link allowlist policy
        run: uv run --locked --no-sync python scripts/check_docs_site.py allowlist

      - name: Build complete Jekyll site
        working-directory: docs
        run: bundle exec jekyll build --strict_front_matter --trace --destination ../_site

      - name: Validate rendered internal links, anchors, and assets
        run: >
          uv run --locked --no-sync python scripts/check_docs_site.py internal
          --site-dir _site
          --config docs/_config.yml

      - name: Upload rendered site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: _site/
          if-no-files-found: error
          retention-days: 14

  external-links:
    name: Scheduled external link check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"

      - name: Sync locked checker dependencies
        run: uv sync --locked --no-install-project

      - name: Download rendered site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-site
          path: _site

      - name: Restore prior successful-link cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: reports/docs-external-links-cache.json
          key: docs-external-links-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            docs-external-links-${{ runner.os }}-

      - name: Check external links with bounded retries
        run: >
          uv run --locked --no-sync python scripts/check_docs_site.py external
          --site-dir _site
          --config docs/_config.yml
          --allowlist config/docs-external-link-allowlist.json
          --cache reports/docs-external-links-cache.json
          --report reports/docs-external-links.json
          --cache-ttl-hours 168
          --retries 2
          --timeout 15
          --max-redirects 5
          --max-bytes 4096

      - name: Upload external-link report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-external-links
          path: reports/docs-external-links.json
          if-no-files-found: warn
          retention-days: 14
