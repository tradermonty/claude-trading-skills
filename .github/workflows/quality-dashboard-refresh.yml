name: Quality dashboard refresh

on:
  schedule:
    - cron: "43 9 * * 1"
  workflow_dispatch:

concurrency:
  group: quality-dashboard-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.10"
      - name: Sync locked environment
        run: uv sync --locked --no-install-project --extra dev
      # GITHUB_TOKEN-created PRs do not normally trigger other workflows.
      - name: Validate refresh code
        run: |
          uv run --locked --no-sync pytest scripts/tests/test_propose_quality_dashboard.py scripts/tests/test_refresh_quality_dashboard.py scripts/tests/test_generate_quality_dashboard.py
          uv run --locked --no-sync ruff check scripts/refresh_quality_dashboard.py scripts/generate_quality_dashboard.py scripts/tests/test_refresh_quality_dashboard.py scripts/tests/test_generate_quality_dashboard.py scripts/tests/test_propose_quality_dashboard.py
          uv run --locked --no-sync ruff format --check scripts/refresh_quality_dashboard.py scripts/generate_quality_dashboard.py scripts/tests/test_refresh_quality_dashboard.py scripts/tests/test_generate_quality_dashboard.py scripts/tests/test_propose_quality_dashboard.py
      - name: Validate publication script syntax
        run: bash -n scripts/propose_quality_dashboard.sh
      - name: Collect evidence and regenerate both pages
        run: |
          uv run --locked --no-sync python scripts/refresh_quality_dashboard.py --repo "$GH_REPO"
          uv run --locked --no-sync python scripts/generate_quality_dashboard.py
          uv run --locked --no-sync python scripts/generate_quality_dashboard.py --check
          uv run --locked --no-sync python scripts/check_docs_site.py source
      - name: Upload proposed snapshot and pages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-dashboard-refresh
          path: |
            docs/assets/quality-dashboard-sources.json
            docs/en/quality-dashboard.md
            docs/ja/quality-dashboard.md
          if-no-files-found: error
          retention-days: 30
      - name: Propose reviewed update
        run: bash scripts/propose_quality_dashboard.sh
