name: Compat nightly

on:
  schedule:
    # Daily at 05:23 UTC — root min-Python (3.10) cross-platform leg for the
    # supported OS/Python matrix (issue #333). A separate workflow keeps the
    # heavy per-skill matrix in ci.yml from re-running every night.
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Keep at most one nightly compat run live so a backlog of queued runs cannot
# stampede the runner pool after a few slow days.
concurrency:
  group: compat-nightly
  cancel-in-progress: true

jobs:
  compat-nightly:
    name: Compat nightly (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"

      # Windows puts the venv on PATH via Scripts; POSIX via bin. The
      # conditional keeps the literal ".venv/bin" substring so the
      # supply-chain wiring test stays valid on every OS.
      - name: Sync locked project environment
        shell: bash
        run: |
          uv sync --locked --no-install-project --extra dev --extra ci
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Install and run core risk/state/navigator suites
        shell: bash
        run: |
          for id in position-sizer futures-position-sizer trader-memory-core drawdown-circuit-breaker trading-skills-navigator
          do
            python scripts/ci_test_matrix.py install --check "$id"
            python scripts/ci_test_matrix.py run "$id"
          done

      - name: Isolated packaged-dependency import (#311)
        shell: bash
        run: |
          # Source tests run against the shared dev environment, which masks
          # missing per-skill dependency declarations via transitive packages
          # (issue #311). Import each core skill's required deps from a clean,
          # isolated environment (no project/dev extras) to fail closed.
          python - <<'PYEOF'
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from check_skill_deps import IMPORT_TO_DIST, parse_requirements

          core = [
              "position-sizer",
              "futures-position-sizer",
              "trader-memory-core",
              "drawdown-circuit-breaker",
              "trading-skills-navigator",
          ]
          failures = []
          for sid in core:
              skills_dir = Path("skills") / sid
              manifest = skills_dir / "requirements.txt"
              if not manifest.exists():
                  failures.append(f"{sid}: missing requirements.txt")
                  continue
              entries, errors = parse_requirements(manifest)
              if errors:
                  failures.append(f"{sid}: parse_errors={errors}")
                  continue
              required = [e for e in entries.values() if not e.optional]
              if not required:
                  print(f"OK   {sid} (stdlib-only)")
                  continue
              with_args = []
              for entry in required:
                  with_args += ["--with", entry.spec]
              # Import the skill's own packaged modules (not just the declared
              # dep names) so a script that pulls an undeclared third-party
              # package (issue #311) fails in this isolated environment.
              scripts_dir = skills_dir / "scripts"
              module_names = sorted(
                  p.stem
                  for p in scripts_dir.glob("*.py")
                  if p.is_file() and p.stem != "__init__"
              )
              if module_names:
                  code = (
                      "import sys\n"
                      f"sys.path.insert(0, {str(scripts_dir)!r})\n"
                      + "".join(f"import {m}\n" for m in module_names)
                  )
              else:
                  code = "import sys"
              proc = subprocess.run(
                  ["uv", "run", "--isolated", "--no-project", *with_args, "python", "-c", code],
                  capture_output=True,
                  text=True,
                  timeout=600,
              )
              if proc.returncode != 0:
                  failures.append(f"{sid}: {code!r} -> {proc.stderr.strip()}")
                  print(f"FAIL {sid}")
              else:
                  print(f"OK   {sid}: imported {module_names}")
          if failures:
              print("ISOLATED IMPORT FAILURES:")
              for item in failures:
                  print("  -", item)
              sys.exit(1)
          PYEOF

      - name: Run cross-platform regression tests
        shell: bash
        run: python -m pytest scripts/tests/test_compat_regressions.py
