name: Hand-maintained skill docs drift

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Skill guide drift (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Report guide drift without executing examples
        run: |
          python3 scripts/report_skill_doc_drift.py --github \
            --json-output reports/skill-doc-drift.json \
            --markdown-output reports/skill-doc-drift.md
          cat reports/skill-doc-drift.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain complete report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-doc-drift
          path: reports/skill-doc-drift.*
          if-no-files-found: error
          retention-days: 30
